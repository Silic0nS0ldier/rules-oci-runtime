name: Release assets
# Assembled the same way for a release as for any other commit, so that a change
# can be tried out before it is released. The calling workflow decides whether
# the assets are published.
description: Builds the launcher binaries and the ruleset archive, and uploads them as artifacts
# Expects Bazel set up and unprivileged user namespaces permitted, as the
# archive check runs a container.
inputs:
  training-image:
    description: "The `bench_image --profile` the launcher's PGO profile is recorded on: `full` for a release, `small` to check the pipeline works"
    required: true
runs:
  using: composite
  steps:
    # Recorded afresh every time, so the profile can never describe an older
    # launcher or toolchain than the one it is built into.
    - name: Profile launcher
      id: pgo
      shell: bash
      working-directory: source
      env:
        TRAINING_IMAGE: ${{ inputs.training-image }}
      run: |
        profile="$(pgo/generate.sh --image "${TRAINING_IMAGE}" --output-dir "${RUNNER_TEMP}/pgo")"
        echo "path=${profile}" >>"${GITHUB_OUTPUT}"
    - uses: actions/upload-artifact@v7
      with:
        name: launcher-profile
        path: ${{ steps.pgo.outputs.path }}
        if-no-files-found: error
    # The C toolchain cross compiles, so one host builds both.
    - name: Build launchers
      shell: bash
      working-directory: source
      env:
        PGO_PROFILE: ${{ steps.pgo.outputs.path }}
      run: |
        for arch in amd64 arm64; do
          bazel build --config="release_linux_${arch}" \
            --//pgo:profile="${PGO_PROFILE}" //:oci_runtime \
            --remote_download_outputs=toplevel \
            --profile="${RUNNER_TEMP}/launcher-${arch}.build.profile.gz"
          install -D -m 0755 .bazel/bin/oci_runtime "../artifacts/oci_runtime.${arch}"
        done
    # Unarchived, so the asset can be downloaded as-is. The file name becomes
    # the artifact name.
    - uses: actions/upload-artifact@v7
      with:
        path: artifacts/oci_runtime.amd64
        if-no-files-found: error
        archive: false
    - uses: actions/upload-artifact@v7
      with:
        path: artifacts/oci_runtime.arm64
        if-no-files-found: error
        archive: false
    - name: Assemble release assets
      id: assemble
      shell: bash
      run: |
        # A release is about to carry the launcher binaries, so its archive
        # can pin them. Anything else has nowhere to pin to, and bakes them in
        # so the archive can be tried out as-is.
        version="0.0.0-ci"
        launcher=(
          --bake-amd64 artifacts/oci_runtime.amd64
          --bake-arm64 artifacts/oci_runtime.arm64
        )
        if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
          version="${GITHUB_REF_NAME#v}"
          launcher=(
            --pin-amd64 "$(sha256sum artifacts/oci_runtime.amd64 | cut -d " " -f 1)"
            --pin-arm64 "$(sha256sum artifacts/oci_runtime.arm64 | cut -d " " -f 1)"
          )
          echo "pinned=true" >>"${GITHUB_OUTPUT}"
        fi
        echo "version=${version}" >>"${GITHUB_OUTPUT}"
        .github/workflows/make_release_archive.sh \
          --version "${version}" \
          "${launcher[@]}" \
          --output "artifacts/rules_oci_runtime-${version}.tar.gz"
        (cd artifacts && sha256sum oci_runtime.* rules_oci_runtime-*.tar.gz | tee sha256sums.txt)
    - name: Check release archive
      shell: bash
      run: |
        # A pinned archive cannot run a container until its assets are up,
        # which the `verify` job covers once they are.
        container=(--run-container)
        if [[ "${{ steps.assemble.outputs.pinned }}" == "true" ]]; then
          container=()
        fi
        .github/workflows/check_release_archive.sh \
          --version "${{ steps.assemble.outputs.version }}" \
          --archive "artifacts/rules_oci_runtime-${{ steps.assemble.outputs.version }}.tar.gz" \
          "${container[@]}"
    # The launcher binaries are already up, one artifact per asset.
    - uses: actions/upload-artifact@v7
      with:
        path: artifacts/rules_oci_runtime-${{ steps.assemble.outputs.version }}.tar.gz
        if-no-files-found: error
        archive: false
    - uses: actions/upload-artifact@v7
      with:
        path: artifacts/sha256sums.txt
        if-no-files-found: error
        archive: false
