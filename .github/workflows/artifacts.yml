name: "Artifacts"
# Release assets, assembled the same way for a release as for any other commit,
# so that a change can be tried out before it is released. The workflow that
# invoked this one decides whether the assets are published.
on:
  workflow_call:
jobs:
  launcher:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: "artifacts-${{ matrix.arch }}"
          repository-cache: true
      - run: bazel build --config=release_linux_${{ matrix.arch }} //:oci_runtime
        working-directory: source
      - run: install -m 0755 source/.bazel/bin/oci_runtime oci_runtime.${{ matrix.arch }}
      # Unarchived, so the asset can be downloaded as-is. The file name becomes
      # the artifact name.
      - uses: actions/upload-artifact@v7
        with:
          path: oci_runtime.${{ matrix.arch }}
          if-no-files-found: error
          archive: false
  # The ruleset archive carries the launcher version and hashes, so it can only
  # be built once both binaries exist.
  archive:
    needs: launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: "artifacts-archive"
          repository-cache: true
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts
      - name: Assemble release assets
        id: assemble
        run: |
          # A release is about to carry the launcher binaries, so its archive
          # can pin them. Anything else has nowhere to pin to, and bakes them in
          # so the archive can be tried out as-is.
          version="0.0.0-ci"
          launcher=(
            --bake-amd64 artifacts/oci_runtime.amd64
            --bake-arm64 artifacts/oci_runtime.arm64
          )
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            version="${GITHUB_REF_NAME#v}"
            launcher=(
              --pin-amd64 "$(sha256sum artifacts/oci_runtime.amd64 | cut -d " " -f 1)"
              --pin-arm64 "$(sha256sum artifacts/oci_runtime.arm64 | cut -d " " -f 1)"
            )
            echo "pinned=true" >>"${GITHUB_OUTPUT}"
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          .github/workflows/make_release_archive.sh \
            --version "${version}" \
            "${launcher[@]}" \
            --output "artifacts/rules_oci_runtime-${version}.tar.gz"
          (cd artifacts && sha256sum oci_runtime.* rules_oci_runtime-*.tar.gz | tee sha256sums.txt)
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, which
      # denies runc the CAP_SYS_ADMIN it needs to unshare the mount namespace.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          # A pinned archive cannot run a container until its assets are up,
          # which the `verify` job covers once they are.
          container=(--run-container)
          if [[ "${{ steps.assemble.outputs.pinned }}" == "true" ]]; then
            container=()
          fi
          .github/workflows/check_release_archive.sh \
            --version "${{ steps.assemble.outputs.version }}" \
            --archive "artifacts/rules_oci_runtime-${{ steps.assemble.outputs.version }}.tar.gz" \
            "${container[@]}"
      # The launcher binaries are already up, one artifact per asset.
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/rules_oci_runtime-${{ steps.assemble.outputs.version }}.tar.gz
          if-no-files-found: error
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/sha256sums.txt
          if-no-files-found: error
          archive: false
