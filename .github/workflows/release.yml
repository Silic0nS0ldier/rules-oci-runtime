name: "Release"
on:
  # Assets are attached to a release someone has already created, so that the
  # tag and the notes can be authored in the GitHub UI.
  release:
    types: [published]
  # Builds the assets without attaching them, to validate changes to this
  # workflow before releasing.
  workflow_dispatch:
jobs:
  artifacts:
    uses: ./.github/workflows/artifacts.yml
  publish:
    needs: artifacts
    if: github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts
      # The archive pins the launcher binaries, so they go up alongside it.
      - run: gh release upload "${GITHUB_REF_NAME}" --clobber artifacts/*
      - name: Append installation instructions
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="rules_oci_runtime-${version}.tar.gz"
          body="$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)"
          # Appended once, so a re-run leaves the authored notes alone.
          if [[ "${body}" == *archive_override* ]]; then
            exit 0
          fi
          cat >notes.md <<EOF
          ${body}

          \`\`\`starlark
          # MODULE.bazel
          bazel_dep(name = "rules_oci_runtime", version = "${version}")
          archive_override(
              module_name = "rules_oci_runtime",
              integrity = "sha256-$(openssl dgst -binary -sha256 "artifacts/${archive}" | base64)",
              strip_prefix = "rules_oci_runtime-${version}",
              urls = ["https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${archive}"],
          )
          \`\`\`
          EOF
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
  # The archive can only be checked end to end once its assets are up, as that
  # is when the launcher binaries it pins become downloadable.
  verify:
    needs: publish
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: "${{ github.workflow }}-verify"
          repository-cache: true
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, which
      # denies runc the CAP_SYS_ADMIN it needs to unshare the mount namespace.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          version="${GITHUB_REF_NAME#v}"
          .github/workflows/check_release_archive.sh \
            --version "${version}" \
            --archive "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/rules_oci_runtime-${version}.tar.gz" \
            --run-container
