name: "Release"
on:
  push:
    tags:
      - "v*"
  # Builds the artifacts without publishing them, to validate changes to this
  # workflow before tagging.
  workflow_dispatch:
jobs:
  artifacts:
    uses: ./.github/workflows/artifacts.yml
  publish:
    needs: artifacts
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts
      - name: Write installation instructions
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="rules_oci_runtime-${version}.tar.gz"
          cat >notes.md <<EOF
          \`\`\`starlark
          # MODULE.bazel
          bazel_dep(name = "rules_oci_runtime", version = "${version}")
          archive_override(
              module_name = "rules_oci_runtime",
              integrity = "sha256-$(openssl dgst -binary -sha256 "artifacts/${archive}" | base64)",
              strip_prefix = "rules_oci_runtime-${version}",
              urls = ["https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${archive}"],
          )
          \`\`\`
          EOF
      - run: gh release create "${GITHUB_REF_NAME}" --generate-notes --notes-file notes.md --verify-tag artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  # Only a published release can be checked end to end, as that is when the
  # launcher binaries the archive pins become downloadable.
  verify:
    needs: publish
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: "${{ github.workflow }}-verify"
          repository-cache: true
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, which
      # denies runc the CAP_SYS_ADMIN it needs to unshare the mount namespace.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          version="${GITHUB_REF_NAME#v}"
          .github/workflows/check_release_archive.sh \
            --version "${version}" \
            --archive "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/rules_oci_runtime-${version}.tar.gz" \
            --run-container
