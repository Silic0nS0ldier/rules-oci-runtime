name: "CI"
on:
  push:
    branches:
      - main
  # Pull request
  pull_request:
    types:
      # Newly opened
      - opened
      # Updated (excludes change of base branch)
      - synchronize
jobs:
  test:
    strategy:
      matrix:
        module: [".", "source"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: "${{ github.workflow }}-test-${{ matrix.module }}"
          repository-cache: true
      - run: bazel test //...
        working-directory: ${{ matrix.module }}
  # Publishes the same assets a release does, as workflow artifacts, so a change
  # can be tried out before it is tagged.
  artifacts:
    uses: ./.github/workflows/artifacts.yml
  devcontainer:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: echo "Built successfully"