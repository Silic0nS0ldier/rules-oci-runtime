name: "CI"
on:
  push:
    branches:
      - main
  # Pull request
  pull_request:
    types:
      # Newly opened
      - opened
      # Updated (excludes change of base branch)
      - synchronize
permissions:
  contents: read
  # Manifest discovery for the Bazel remote cache.
  actions: read
jobs:
  # Commits pushed with the workflow token start no new run, so the other Bazel
  # jobs wait for this one and check out what it committed.
  renovate_tasks:
    name: Renovate lockfiles
    if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit.outputs.COMMIT_HASH }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Required to have correct ref for git-auto-commit-action
          ref: ${{ github.head_ref }}
      - uses: ./.github/actions/bazel
        with:
          name: renovate
          # Pull requests do not upload, so there is no staging to run away.
          fail-on-cache-error: "false"
      # A module's lockfile covers the modules it overrides, so any of them can
      # go stale.
      - run: |
          for module in . source e2e/smoke e2e/conformance; do
            (cd "${module}" && bazel mod deps --lockfile_mode=update)
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bazel-profiles-renovate
          path: ${{ runner.temp }}/*.profile.gz
          if-no-files-found: ignore
      - uses: stefanzweifel/git-auto-commit-action@v6
      - id: get_commit
        run: echo "COMMIT_HASH=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
  # One job, so a run restores from and publishes to the Actions cache once
  # rather than once per module. Steps carry on past a failure so every module
  # is reported on, and the last step fails the job.
  build_and_test:
    name: Build and test
    # `renovate_tasks` is skipped on most runs, and a skip propagates down the
    # `needs` chain unless a status function is used.
    if: ${{ !cancelled() && needs.renovate_tasks.result != 'failure' }}
    needs: renovate_tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.renovate_tasks.outputs.commit_hash }}
      - uses: ./.github/actions/bazel
        with:
          name: build_and_test
      # A rootless container is a user namespace, which Ubuntu confines by
      # default. Older images have no such knob, hence the check.
      - name: Permit unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Every module writes its own profile, rather than overwriting the last.
      - name: Test root
        id: test_root
        continue-on-error: true
        run: bazel test //... --profile="${RUNNER_TEMP}/root.test.profile.gz"
      - uses: actions/upload-artifact@v7
        if: steps.test_root.outcome == 'failure'
        with:
          name: test-logs-root
          path: .bazel/testlogs/**/test.log
          include-hidden-files: true
      - name: Test source
        id: test_source
        continue-on-error: true
        run: bazel test //... --profile="${RUNNER_TEMP}/source.test.profile.gz"
        working-directory: source
      - uses: actions/upload-artifact@v7
        if: steps.test_source.outcome == 'failure'
        with:
          name: test-logs-source
          path: source/.bazel/testlogs/**/test.log
          include-hidden-files: true
      # The end to end modules reach the network for an image and for `umoci`,
      # run outside the Bazel sandbox, and need user namespaces. They are steps
      # of their own so a flake in one is not read as the launcher being broken.
      - name: E2E smoke
        id: e2e_smoke
        continue-on-error: true
        run: bazel test //... --profile="${RUNNER_TEMP}/e2e-smoke.test.profile.gz"
        working-directory: e2e/smoke
      - uses: actions/upload-artifact@v7
        if: steps.e2e_smoke.outcome == 'failure'
        with:
          name: test-logs-e2e-smoke
          path: e2e/smoke/.bazel/testlogs/**/test.log
          include-hidden-files: true
      - name: E2E conformance
        id: e2e_conformance
        continue-on-error: true
        run: bazel test //... --profile="${RUNNER_TEMP}/e2e-conformance.test.profile.gz"
        working-directory: e2e/conformance
      - uses: actions/upload-artifact@v7
        if: steps.e2e_conformance.outcome == 'failure'
        with:
          name: test-logs-e2e-conformance
          path: e2e/conformance/.bazel/testlogs/**/test.log
          include-hidden-files: true
      # Publishes the same assets a release does, as workflow artifacts, so a
      # change can be tried out before it is released. The launcher is trained
      # on a small image: enough to prove the profile is generated and taken
      # up, without the release's cost.
      - name: Release assets
        id: artifacts
        continue-on-error: true
        uses: ./.github/actions/artifacts
        with:
          training-image: small
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bazel-profiles
          path: ${{ runner.temp }}/*.profile.gz
          if-no-files-found: ignore
      - if: >
          steps.test_root.outcome == 'failure' ||
          steps.test_source.outcome == 'failure' ||
          steps.e2e_smoke.outcome == 'failure' ||
          steps.e2e_conformance.outcome == 'failure' ||
          steps.artifacts.outcome == 'failure'
        run: exit 1
  devcontainer:
    name: Devcontainer ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: echo "Built successfully"
          push: never