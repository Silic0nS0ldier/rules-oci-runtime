name: "CI"
on:
  push:
    branches:
      - main
  # Pull request
  pull_request:
    types:
      # Newly opened
      - opened
      # Updated (excludes change of base branch)
      - synchronize
permissions:
  contents: read
  # Manifest discovery for the Bazel remote cache.
  actions: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - module: "."
            name: root
          - module: source
            name: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bazel
        with:
          name: ${{ matrix.name }}
      - run: bazel test //...
        working-directory: ${{ matrix.module }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs-${{ matrix.name }}
          path: ${{ matrix.module }}/.bazel/testlogs/**/test.log
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bazel-profiles-${{ matrix.name }}
          path: ${{ runner.temp }}/*.profile.gz
          if-no-files-found: ignore
  # The end to end modules are kept apart from the unit tests: they reach the
  # network for an image and for `umoci`, they run outside the Bazel sandbox,
  # and they need user namespaces. A flake in one should not be read as the
  # launcher being broken.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: e2e/smoke
            name: e2e-smoke
          - module: e2e/conformance
            name: e2e-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bazel
        with:
          name: ${{ matrix.name }}
      # A rootless container is a user namespace, which Ubuntu confines by
      # default. Older images have no such knob, hence the check.
      - name: Permit unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: bazel test //...
        working-directory: ${{ matrix.module }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs-${{ matrix.name }}
          path: ${{ matrix.module }}/.bazel/testlogs/**/test.log
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bazel-profiles-${{ matrix.name }}
          path: ${{ runner.temp }}/*.profile.gz
          if-no-files-found: ignore
  # Publishes the same assets a release does, as workflow artifacts, so a change
  # can be tried out before it is released.
  artifacts:
    uses: $/.github/workflows/artifacts.yml
  devcontainer:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: echo "Built successfully"
          push: never