# Bazel downloader rewrites, see `--experimental_downloader_config` in `.bazelrc`.
#
# musl.libc.org is the only URL `@llvm` pins for the musl sources and it is
# frequently slow to the point of timing out. Alpine mirrors the release
# tarballs byte for byte, so try there first and keep upstream as the fallback.
# A rewritten URL replaces the original, hence the identity rule below.
rewrite musl\.libc\.org/releases/(.*) distfiles.alpinelinux.org/distfiles/edge/$1
rewrite musl\.libc\.org/releases/(.*) musl.libc.org/releases/$1
