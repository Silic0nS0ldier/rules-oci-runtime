
[workspace]
resolver = "3"

[package]
name = "oci_runtime"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "oci_runtime"
path = "src/main.rs"

[dependencies]
camino = "1.2.2"
clap = { version = "4.5.54", features = ["derive"] }
flate2 = "1.1.5"
libc = "0.2.180"
ruzstd = "0.8.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4.44"
