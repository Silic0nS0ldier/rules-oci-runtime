
[workspace]
resolver = "3"

[package]
name = "oci_runtime"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "oci_runtime"
path = "src/main.rs"

[dependencies]
camino = "1.2.5"
clap = { version = "4.6.3", features = ["derive"] }
flate2 = "1.1.9"
libc = "0.2.184"
ruzstd = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
